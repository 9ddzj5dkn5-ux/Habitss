<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Привычки и дела</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--text:#1d2420;--mute:#7a847d;--line:#e3e0d8;--accent:#1f6f5b;--onacc:#fff;--done:#cfe5dd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1d2521;--text:#eef2ef;--mute:#8a968f;--line:#2b3631;--accent:#4cc3a0;--onacc:#0d1512;--done:#24433a}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1d2521;--text:#eef2ef;--mute:#8a968f;--line:#2b3631;--accent:#4cc3a0;--onacc:#0d1512;--done:#24433a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:9px;border-radius:9px;font:inherit;font-weight:600}
.tabs button.on{background:var(--card);color:var(--text)}
.add{display:flex;gap:8px;margin-bottom:14px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px 14px;border-radius:12px;font:inherit}
.add input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.add button{border:0;background:var(--accent);color:var(--onacc);width:48px;border-radius:12px;font-size:24px;font-weight:600}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.top{display:flex;align-items:center;gap:8px}
.name{flex:1;font-weight:600;overflow-wrap:anywhere}
.streak{color:var(--accent);font-size:14px;font-weight:600;white-space:nowrap}
.del{border:0;background:none;color:var(--mute);font-size:20px;padding:0 4px}
.days{display:flex;justify-content:space-between;margin-top:10px}
.d{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:12px}
.d button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--onacc);font-size:16px}
.d button.on{background:var(--accent);border-color:var(--accent)}
.d.today button{border-color:var(--accent)}
.d.today{color:var(--text);font-weight:600}
.task{display:flex;align-items:center;gap:12px}
.chk{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--mute);background:none;color:var(--onacc);flex:none;font-size:15px}
.task.done .chk{background:var(--accent);border-color:var(--accent)}
.task.done .name{color:var(--mute);text-decoration:line-through;font-weight:400}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
</style>
</head>
<body>
<main>
  <h1 id="title">Сегодня</h1>
  <p class="sub" id="sub"></p>
  <div class="tabs">
    <button id="t-h" class="on">Привычки</button>
    <button id="t-t">Дела</button>
  </div>
  <div class="add">
    <input id="inp" maxlength="60" autocomplete="off">
    <button id="addBtn" aria-label="Добавить">+</button>
  </div>
  <div class="bar"><i id="prog" style="width:0"></i></div>
  <div id="list"></div>
</main>

<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    var p = tg.themeParams || {};
    var r = document.documentElement.style;
    if (p.bg_color) r.setProperty('--bg', p.bg_color);
    if (p.secondary_bg_color) r.setProperty('--card', p.secondary_bg_color);
    if (p.text_color) r.setProperty('--text', p.text_color);
    if (p.hint_color) r.setProperty('--mute', p.hint_color);
    if (p.button_color) r.setProperty('--accent', p.button_color);
    if (p.button_text_color) r.setProperty('--onacc', p.button_text_color);
    document.documentElement.setAttribute('data-theme', tg.colorScheme === 'dark' ? 'dark' : 'light');
  }
  function buzz(){ try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch(e){} }

  var KEY = 'habit-todo-v1';
  var state = { habits: [], tasks: [] };
  try { var raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw); } catch(e){}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

  var tab = 'h';
  var $ = function(id){ return document.getElementById(id); };
  var WD = ['вс','пн','вт','ср','чт','пт','сб'];
  function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function lastDays(n){ var a = []; for (var i = n-1; i >= 0; i--) { var d = new Date(); d.setDate(d.getDate()-i); a.push(d); } return a; }
  function streak(h){
    var n = 0, d = new Date();
    if (h.log.indexOf(iso(d)) < 0) d.setDate(d.getDate()-1);
    while (h.log.indexOf(iso(d)) >= 0) { n++; d.setDate(d.getDate()-1); }
    return n;
  }
  function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function render(){
    var list = $('list'), html = '', today = iso(new Date()), done = 0, total = 0;
    $('t-h').className = tab === 'h' ? 'on' : '';
    $('t-t').className = tab === 't' ? 'on' : '';
    $('inp').placeholder = tab === 'h' ? 'Новая привычка, например «Вода 2 л»' : 'Новое дело';
    if (tab === 'h') {
      total = state.habits.length;
      state.habits.forEach(function(h, i){
        var on = h.log.indexOf(today) >= 0; if (on) done++;
        var s = streak(h);
        html += '<div class="row"><div class="top"><span class="name">' + esc(h.name) + '</span>' +
          (s ? '<span class="streak">' + s + ' дн. подряд</span>' : '') +
          '<button class="del" data-del="' + i + '" aria-label="Удалить">×</button></div><div class="days">';
        lastDays(7).forEach(function(d){
          var k = iso(d), isT = k === today, c = h.log.indexOf(k) >= 0;
          html += '<div class="d' + (isT ? ' today' : '') + '"><button class="' + (c ? 'on' : '') + '" data-h="' + i + '" data-d="' + k + '" aria-label="' + k + '">' + (c ? '✓' : '') + '</button>' + WD[d.getDay()] + '</div>';
        });
        html += '</div></div>';
      });
      if (!total) html = '<div class="empty">Привычек пока нет. Добавьте первую, и отмечайте её каждый день.</div>';
      $('sub').textContent = total ? 'Сегодня выполнено ' + done + ' из ' + total : 'Начните с одной привычки';
    } else {
      total = state.tasks.length;
      state.tasks.forEach(function(t, i){
        if (t.done) done++;
        html += '<div class="row"><div class="task' + (t.done ? ' done' : '') + '"><button class="chk" data-t="' + i + '" aria-label="Готово">' + (t.done ? '✓' : '') + '</button><span class="name">' + esc(t.name) + '</span><button class="del" data-dt="' + i + '" aria-label="Удалить">×</button></div></div>';
      });
      if (!total) html = '<div class="empty">Список пуст. Запишите, что нужно сделать.</div>';
      $('sub').textContent = total ? 'Сделано ' + done + ' из ' + total : 'Запишите первое дело';
    }
    $('prog').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
    list.innerHTML = html;
  }

  function add(){
    var v = $('inp').value.trim(); if (!v) return;
    if (tab === 'h') state.habits.push({ name: v, log: [] });
    else state.tasks.unshift({ name: v, done: false });
    $('inp').value = ''; save(); render(); buzz();
  }

  $('addBtn').onclick = add;
  $('inp').onkeydown = function(e){ if (e.key === 'Enter') add(); };
  $('t-h').onclick = function(){ tab = 'h'; render(); };
  $('t-t').onclick = function(){ tab = 't'; render(); };
  $('list').onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    var a = b.dataset;
    if (a.h !== undefined) {
      var h = state.habits[+a.h], k = h.log.indexOf(a.d);
      if (k >= 0) h.log.splice(k, 1); else h.log.push(a.d);
    } else if (a.del !== undefined) {
      if (!confirm('Удалить привычку?')) return;
      state.habits.splice(+a.del, 1);
    } else if (a.t !== undefined) {
      state.tasks[+a.t].done = !state.tasks[+a.t].done;
    } else if (a.dt !== undefined) {
      state.tasks.splice(+a.dt, 1);
    } else return;
    save(); render(); buzz();
  };
  render();
})();
</script>
</body>
</html>
